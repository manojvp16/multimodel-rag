[project]
name = "omnirag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manojvp16", email = "manojvipipare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langchain-text-splitters>=1.1.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
omnirag = "omnirag.main:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
